<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Crystal Orb — test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #orbContainer { width: 100%; height: 100%; cursor: grab; }
  #orbContainer.dragging { cursor: grabbing; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.5 monospace; color: #cfe; background: rgba(0,0,0,0.6);
    padding: 12px 14px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;
    width: 260px;
  }
  #panel h2 { font-size: 12px; margin: 0; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
  #panel .row { display: flex; flex-direction: column; gap: 3px; }
  #panel input[type="range"] { width: 100%; }
  #panel label { display: flex; justify-content: space-between; }
  #panel .toggle { display: flex; align-items: center; gap: 6px; }
  #status { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px; opacity: 0.85; }
  #status div { display: flex; justify-content: space-between; }
  #hint { position: fixed; bottom: 10px; left: 12px; z-index: 10; font: 11px monospace; color: #7a9; opacity: 0.7; }
</style>
</head>
<body>
  <div id="orbContainer"></div>
  <div id="hint">dra i bakgrunnen for å rotere kameraet rundt orben</div>

  <div id="panel">
    <div class="row">
      <label>spinIntensity <span id="spinVal">0.00</span></label>
      <input id="spinSlider" type="range" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="row">
      <div class="toggle">
        <input type="checkbox" id="rotOverrideOn">
        <label for="rotOverrideOn" style="display:inline">manuell rotasjonshastighet</label>
      </div>
      <input id="rotSlider" type="range" min="0" max="3" step="0.01" value="0.08" disabled>
    </div>

    <div class="row">
      <div class="toggle">
        <input type="checkbox" id="noiseOverrideOn">
        <label for="noiseOverrideOn" style="display:inline">manuell fluiditet</label>
      </div>
      <input id="noiseSlider" type="range" min="0" max="0.3" step="0.002" value="0" disabled>
    </div>

    <div id="status">
      <h2>Status (live)</h2>
      <div><span>rotasjonshastighet</span><span id="statRot">0.00</span></div>
      <div><span>fluiditet (noise-amp)</span><span id="statNoise">0.000</span></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { createCrystalOrbScene } from './scene.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('orbContainer');
    const handle = createCrystalOrbScene(container);

    // Free camera orbiting for inspecting the shape/deformation from any
    // angle — separate from the scene's own animate() loop, which stays
    // untouched; this just nudges the same camera before each render.
    const controls = new OrbitControls(handle.camera, handle.renderer.domElement);
    controls.target.set(0, 0.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.update();

    container.addEventListener('pointerdown', () => container.classList.add('dragging'));
    window.addEventListener('pointerup', () => container.classList.remove('dragging'));

    (function controlsLoop() {
      requestAnimationFrame(controlsLoop);
      controls.update();
    })();

    // --- spinIntensity ---
    const spinSlider = document.getElementById('spinSlider');
    const spinVal = document.getElementById('spinVal');
    spinSlider.addEventListener('input', () => {
      const v = parseFloat(spinSlider.value);
      handle.setSpinIntensity(v);
      spinVal.textContent = v.toFixed(2);
    });

    // --- manual rotation speed override ---
    const rotOverrideOn = document.getElementById('rotOverrideOn');
    const rotSlider = document.getElementById('rotSlider');
    function applyRotOverride() {
      if (rotOverrideOn.checked) {
        handle.setRotationSpeedOverride(parseFloat(rotSlider.value));
      } else {
        handle.setRotationSpeedOverride(null);
      }
    }
    rotOverrideOn.addEventListener('change', () => {
      rotSlider.disabled = !rotOverrideOn.checked;
      applyRotOverride();
    });
    rotSlider.addEventListener('input', applyRotOverride);

    // --- manual fluidity (noise amplitude) override ---
    const noiseOverrideOn = document.getElementById('noiseOverrideOn');
    const noiseSlider = document.getElementById('noiseSlider');
    function applyNoiseOverride() {
      if (noiseOverrideOn.checked) {
        handle.setNoiseAmpOverride(parseFloat(noiseSlider.value));
      } else {
        handle.setNoiseAmpOverride(null);
      }
    }
    noiseOverrideOn.addEventListener('change', () => {
      noiseSlider.disabled = !noiseOverrideOn.checked;
      applyNoiseOverride();
    });
    noiseSlider.addEventListener('input', applyNoiseOverride);

    // --- live status readout ---
    const statRot = document.getElementById('statRot');
    const statNoise = document.getElementById('statNoise');
    (function statusLoop() {
      requestAnimationFrame(statusLoop);
      statRot.textContent = handle.status.rotationSpeed.toFixed(2);
      statNoise.textContent = handle.status.noiseAmp.toFixed(3);
    })();

    // Quick way to jump straight to the agitated state without touching
    // the slider: append ?spin=1 (or any 0..1 value) to the URL.
    const forced = new URLSearchParams(location.search).get('spin');
    if (forced !== null) {
      const v = parseFloat(forced);
      handle.setSpinIntensity(v);
      spinSlider.value = String(v);
      spinVal.textContent = v.toFixed(2);
    }
  </script>
</body>
</html>
