<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exterior art: the orb's material as architecture</title>
<style>
  html, body { margin: 0; background: #05040a; color: #cfc6e6; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
/* The loading screen's exterior, rendered offline into the layers that
   loading-exterior.js shows (assets/loading/). Not loaded by the site.

   One floating building grown from the portal orb's material
   (portal-orb-material.js): a dark translucent shell whose inside turns in
   layers, with the orb's teal heart, its sparse curved currents, mist and
   glow pockets, a Fresnel skin with a thin film's violet and green at the
   edges, and light wrapping its edges. The glass is molten, never machine
   perfect. An orb-derived dome on a short drum with one pointed entrance;
   beneath, the glass gathers into a drop on a narrowing neck, and runs off
   the drum's lower lip in a few drips; a tower grown from the same glass,
   with a current spiralling up inside it, drawn up into a pointed spire.
   Its windows are light inside the glass, not holes cut in it.

   window.exteriorArt.render({size, time, subject, samples}) draws one layer
   (subject 'building', or 'drop': the drop that falls from the neck) and
   resolves with a canvas; .encode(canvas) gives WebP; .points gives the
   entrance, the neck's tip and the spire's tip in the image (fractions).
   dev/exterior-export.mjs writes the layers to assets/loading/. */
const canvas = document.getElementById('art');
const gl = canvas.getContext('webgl', {alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: false});

// The camera: a little below and to the left of the entrance, looking a
// touch up at it; a long lens, so the building is not distorted.
const CAMERA = {target: [0.1, 0.42, 0], distance: 12.4, yaw: -0.2, pitch: -0.07, fov: 0.405};
// The falling drop, alone and close.
const DROP_CAMERA = {target: [0, 0, 0], distance: 1.5, yaw: -0.2, pitch: -0.07, fov: 0.405};
// The entrance: centre of its pointed arch, half-width, springing line and sill.
const DOOR = {x: 0, a: 0.2, spring: -0.1, sill: -0.44};
const TOWER = [.84, 0, -.52];
const NECK_TIP = [0, -1.45, 0];

const fragment = `precision highp float;
uniform vec2 resolution;
uniform vec2 jitter;
uniform float time;
uniform float subject;     // 0: the building; 1: the falling drop alone
uniform vec3 camPos, camFwd, camRight, camUp;
uniform float camScale;

const vec3 DOME = vec3(0., .14, 0.);
const vec3 TOWER = vec3(${TOWER.join(', ')});
const float DOOR_X = ${DOOR.x.toFixed(3)}, DOOR_A = ${DOOR.a.toFixed(3)}, DOOR_SPRING = ${DOOR.spring.toFixed(3)}, DOOR_SILL = ${DOOR.sill.toFixed(3)};

// ---- Noise ------------------------------------------------------------------
float hash3(vec3 p) { p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1., 0., 0.)), f.x), mix(hash3(i + vec3(0., 1., 0.)), hash3(i + vec3(1., 1., 0.)), f.x), f.y),
    mix(mix(hash3(i + vec3(0., 0., 1.)), hash3(i + vec3(1., 0., 1.)), f.x), mix(hash3(i + vec3(0., 1., 1.)), hash3(i + vec3(1., 1., 1.)), f.x), f.y), f.z);
}

// ---- Shape -----------------------------------------------------------------
float smin(float a, float b, float k) { float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.) / k1; }
float sdCylinder(vec3 p, float r, float h, float rr) { vec2 d = vec2(length(p.xz) - r + rr, abs(p.y) - h + rr); return min(max(d.x, d.y), 0.) + length(max(d, 0.)) - rr; }
// A rounded cone along y: radius ra at y = 0, rb at y = h (|ra - rb| < h).
float sdRoundCone(vec3 p, float ra, float rb, float h) {
  vec2 q = vec2(length(p.xz), p.y);
  float b = (ra - rb) / h, a = sqrt(1. - b * b), k = dot(q, vec2(-b, a));
  if (k < 0.) return length(q) - ra;
  if (k > a * h) return length(q - vec2(0., h)) - rb;
  return dot(q, vec2(a, b)) - ra;
}
// A pointed (equilateral) arch in the xy plane: half-width a, springing at y0,
// straight sides down to ys. Inside is negative. (The two circles' lens below
// the springing line lies within the sides, so it is cut only at the sill.)
float sdArch(vec2 p, float a, float y0, float ys) {
  float upper = max(max(length(p - vec2(a, y0)) - 2. * a, length(p - vec2(-a, y0)) - 2. * a), ys - p.y);
  vec2 d = abs(p - vec2(0., (y0 + ys) * .5)) - vec2(a, (y0 - ys) * .5);
  float lower = min(max(d.x, d.y), 0.) + length(max(d, 0.));
  return min(upper, lower);
}
// The drips that run off the drum's lower lip: where round it (radians from
// +x toward the viewer), how long, and whether a bead has gathered at the end.
float dripAngle(int i) { if (i == 0) return .42; if (i == 1) return 1.12; if (i == 2) return 1.98; if (i == 3) return 2.46; return 2.92; }
float dripLength(int i) { if (i == 0) return .26; if (i == 1) return .46; if (i == 2) return .16; if (i == 3) return .58; return .3; }
float dripBead(int i) { return (i == 1 || i == 3) ? 1. : 0.; }

// The scene: distance, and the part hit (0 glass, 1 the entrance's walls,
// 2 the light inside the entrance).
vec2 scene(vec3 p) {
  if (subject > .5) {
    // The drop: a round belly drawn up into a short point, as it leaves the neck.
    float belly = sdEllipsoid(p - vec3(0., -.02, 0.), vec3(.085, .095, .085));
    float tip = sdRoundCone(p - vec3(0., .02, 0.), .06, .004, .13);
    return vec2(smin(belly, tip, .05), 0.);
  }
  // The body: an orb-derived dome, swelling a little over a short drum.
  float dome = sdEllipsoid(p - DOME, vec3(1.07, .98, 1.07));
  float crown = sdRoundCone(p - vec3(0., .96, 0.), .15, .003, .48);
  dome = smin(dome, crown, .14);
  // The drum swells a little between its lips, as the orb's curve goes on.
  float drum = sdCylinder(p - vec3(0., -.2, 0.), 1.0 + .03 * (1. - pow((p.y + .2) / .3, 2.)), .3, .06);
  float body = smin(dome, drum, .06);
  // Two smooth lips of the same glass.
  float lipTop = length(vec2(length(p.xz) - 1.02, p.y - .1)) - .035;
  float lipLow = length(vec2(length(p.xz) - .995, p.y + .5)) - .045;
  body = smin(body, min(lipTop, lipLow), .045);
  // The glass runs off the lower lip in a few drips of its own lengths.
  float drips = 1e3;
  for (int i = 0; i < 5; i++) {
    float a = dripAngle(i), len = dripLength(i);
    // Each runs down the bowl's curve as it falls: in toward the axis a
    // little with every step down.
    vec3 dir = vec3(cos(a), 0., sin(a));
    vec3 q = p - vec3(0., -.5, 0.);
    float down = clamp(-q.y, 0., len);
    q -= dir * (1. - .3 * down / .36 * down / .36 * .36);
    q.y = p.y + .5;
    float drip = sdRoundCone(q - vec3(0., -len, 0.), .014, .05, len);
    if (dripBead(i) > .5) drip = smin(drip, length(q - vec3(0., -len - .006, 0.)) - .032, .025);
    drips = min(drips, drip);
  }
  body = smin(body, drips, .06);
  // Beneath: the glass gathers into a drop on a narrowing neck, as the orb's
  // own neck forms; a bead is about to leave its tip.
  float bowl = sdEllipsoid(p - vec3(0., -.52, 0.), vec3(.94, .36, .94));
  float neck = sdRoundCone(p - vec3(0., -1.33, 0.), .018, .56, .79);
  float bead = sdEllipsoid(p - vec3(${NECK_TIP.map(v => v.toFixed(3)).join(', ')}), vec3(.082, .092, .082));
  body = smin(body, smin(smin(bowl, neck, .25), bead, .035), .12);
  // The tower grows out of the same glass: a shaft, a slow swell where it
  // gathers itself, and the spire drawn out of it like a drop pulled upward.
  vec3 t = p - TOWER;
  float shaft = sdRoundCone(t - vec3(0., -.7, 0.), .27, .2, 2.04);
  float bulb = sdEllipsoid(t - vec3(0., 1.36, 0.), vec3(.215, .3, .215));
  float spire = sdRoundCone(t - vec3(0., 1.42, 0.), .18, .003, 1.28);
  float tower = smin(smin(shaft, bulb, .12), spire, .14);
  float towerFoot = sdRoundCone(t - vec3(0., -1.12, 0.), .016, .24, .44);
  towerFoot = smin(towerFoot, length(t - vec3(0., -1.13, 0.)) - .03, .02);
  tower = smin(tower, towerFoot, .12);
  float shape = smin(body, tower, .24);
  // Molten: the glass is never machine-perfect.
  shape += (vnoise(p * 2.6 + 3.1) - .5) * .02 + (vnoise(p * 7.3 + 1.7) - .5) * .006;

  // The entrance: a shallow frame, then the deep pointed opening, both with
  // softened edges.
  vec2 dp = vec2(p.x - DOOR_X, p.y);
  float frame = max(sdArch(dp, DOOR_A + .045, DOOR_SPRING, DOOR_SILL - .035), .93 - p.z);
  float opening = max(sdArch(dp, DOOR_A, DOOR_SPRING, DOOR_SILL), .42 - p.z);
  float d = smax(shape, -frame, .018);
  d = smax(d, -opening, .014);
  float part = 0.;
  if (frame < .006 || opening < .006) part = 1.;
  if (opening < .004 && p.z < .46) part = 2.;
  return vec2(d, part);
}
vec3 normalAt(vec3 p) {
  vec2 e = vec2(.0012, 0.);
  return normalize(vec3(scene(p + e.xyy).x - scene(p - e.xyy).x, scene(p + e.yxy).x - scene(p - e.yxy).x, scene(p + e.yyx).x - scene(p - e.yyx).x));
}

// ---- The orb's material (portal-orb-material.js) ---------------------------
vec3 spinAbout(vec3 p, float angle) { float c = cos(angle), s = sin(angle); return vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z); }
// The lights of the void: a cool key from above left, green and violet from
// behind (as in the room), a restrained warmth from below the entrance.
vec3 lightDir(int i) {
  if (i == 0) return normalize(vec3(-.55, .8, .55));
  if (i == 1) return normalize(vec3(-.95, .15, -.55));
  if (i == 2) return normalize(vec3(.9, .35, -.6));
  if (i == 3) return normalize(vec3(.15, -.7, .75));
  return normalize(vec3(.2, 1., .2));
}
vec3 lightCol(int i) {
  if (i == 0) return vec3(.62, .68, .74);
  if (i == 1) return vec3(.12, .62, .46);
  if (i == 2) return vec3(.46, .22, .78);
  if (i == 3) return vec3(.42, .26, .12) * .5;
  return vec3(.08, .1, .14);
}
// The void as the skin mirrors it: near black, faint violet and teal.
vec3 voidLight(vec3 R) {
  vec3 c = mix(vec3(.002, .002, .004), vec3(.012, .01, .02), smoothstep(-.3, .9, R.y));
  c += vec3(.02, .05, .045) * pow(max(0., -R.x * .7 + .3), 3.) + vec3(.04, .02, .06) * pow(max(0., R.x * .7 + .2), 3.);
  for (int i = 0; i < 5; i++) { float d = dot(R, lightDir(i)); c += lightCol(i) * (exp((d - 1.) * 9.) * .025 + exp((d - 1.) * 120.) * .2); }
  return c;
}
vec3 display(vec3 c) { c = 1. - exp(-c * 1.15); return mix(c * 12.92, 1.055 * pow(c, vec3(1. / 2.4)) - .055, step(vec3(.0031308), c)); }

float fbm3(vec3 p) { return vnoise(p) * .55 + vnoise(p * 2.07 + 3.1) * .3 + vnoise(p * 4.13 + 7.7) * .15; }
// The inside, as the orb's, enlarged into the building's mass (the same as
// loading-exterior-3d-worker.js): layers turning about the body's axis and
// twisting with height, the flow folded on itself, broad marbled ribbons of
// teal and aqua (violet where the field turns) with bright cores, soft
// luminous clouds where they gather, a cloudy mist of darker and brighter
// zones, the teal heart deep inside and sunk into the drop; nearly two units
// deep, so the currents hang inside the glass. Up the tower a current spirals.
vec3 inside(vec3 P, vec3 rd, out float T) {
  vec3 inner = vec3(0.); T = 1.;
  float stepLen = 1.8 / 24.;
  for (int i = 0; i < 24; i++) {
    vec3 q = P + rd * (float(i) + .5) * stepLen;
    if (scene(q).x > .01) break;
    bool inTower = length((q - TOWER).xz) < .34 && q.y > -.2;
    vec3 c = subject > .5 ? vec3(0.) : inTower ? vec3(TOWER.x, clamp(q.y, .1, 1.7), TOWER.z) : DOME;
    vec3 lq = (q - c) / (subject > .5 ? .1 : inTower ? .36 : 1.);
    float r = length(lq);
    vec3 a = spinAbout(lq, time * .11 * (1.4 - r * .6) + lq.y * 1.3 + r * 1.1);
    vec3 fold = vec3(vnoise(a * 1.2 + vec3(0., time * .03, 0.)), vnoise(a * 1.2 + vec3(5.2, -time * .025, 1.3)), vnoise(a * 1.2 + vec3(2.7, 0., 8.1)));
    vec3 wq = a + (fold - .5) * 1.15;
    float band = 1. - abs(sin(wq.y * 1.45 + fbm3(wq * .8) * 4.6 + r * 1.7));
    float broad = pow(band, 5.), core = pow(band, 16.);
    float zone = smoothstep(.32, .72, vnoise(a * .62 + vec3(9.1, time * .02, 3.3)));
    float dens = smoothstep(.32, .72, fbm3(a * 2.3 + vec3(1.3, time * .04, 0.)));
    float turn = smoothstep(.38, .72, vnoise(wq * .7 + 4.));
    vec3 ribbon = mix(vec3(.05, .44, .4), vec3(.28, .15, .58), turn * .75);
    vec3 glow = ribbon * (broad * 1.1 + core * 3.6) * (.35 + 1.1 * dens) * (.05 + 1.4 * zone) + vec3(.003, .014, .016) * dens * dens;
    glow += mix(vec3(.03, .2, .19), vec3(.12, .07, .24), turn) * dens * zone * zone * .55;
    float heart = exp(-r * r * (inTower ? 4. : 6.5)) * (inTower ? .14 : .3) * (1. + .3 * sin(time * .46));
    if (!inTower && subject < .5) { vec3 sq = q - vec3(0., -.86, 0.); heart += exp(-dot(sq, sq) * 9.) * .3 * (1. + .3 * sin(time * .46 + 1.4)); }
    glow += vec3(.14, .82, .64) * heart * .6;
    if (inTower && subject < .5) {
      vec3 tq = q - TOWER;
      float helix = pow(max(0., cos(atan(tq.z, tq.x) * 2. - tq.y * 6.2 + time * .5)), 30.) * smoothstep(.08, .2, length(tq.xz));
      glow += mix(vec3(.08, .62, .52), vec3(.42, .2, .74), smoothstep(.2, 2.2, tq.y)) * helix * .9;
    }
    inner += T * glow * stepLen * 2.;
    T *= exp(-(.85 + dens * 3.4) * stepLen);
  }
  return inner;
}

// The room's light as seen through the entrance: warm lamplight low in the
// middle, the room's green and violet at the sides, darker high up.
vec3 roomThrough(vec3 p) {
  vec2 u = vec2((p.x - DOOR_X) / DOOR_A, (p.y - DOOR_SILL) / (DOOR_SPRING + DOOR_A * 1.732 - DOOR_SILL));
  vec3 warm = vec3(1., .55, .24) * exp(-pow(u.x / .55, 2.)) * exp(-pow((u.y - .1) / .22, 2.)) * 1.1
    + vec3(.9, .5, .22) * exp(-pow(u.x / .3, 2.)) * exp(-pow((u.y - .42) / .18, 2.)) * .35;
  vec3 sides = mix(vec3(.04, .36, .28), vec3(.3, .13, .52), smoothstep(-1., 1., u.x)) * .32 * smoothstep(.3, 1., abs(u.x));
  vec3 deep = mix(vec3(.03, .035, .04), vec3(.006, .014, .018), smoothstep(.15, .85, u.y));
  return (warm + sides + deep) * (1. - .55 * smoothstep(.55, 1., abs(u.x)));
}
// The windows: light held inside the glass, not holes in it; soft-edged.
vec3 windowLight(vec3 P) {
  vec3 c = vec3(0.);
  if (P.z > .55) for (int i = 0; i < 2; i++) {
    float side = i == 0 ? -1. : 1.;
    float w = sdArch(vec2(P.x - side * .6, P.y), .03, -.06, -.26);
    c += mix(vec3(.08, .5, .44), vec3(.36, .18, .62), .35) * (smoothstep(.006, -.012, w) * .9 + smoothstep(.06, -.01, w) * .18);
  }
  vec3 tf = P - TOWER;
  if (tf.z > .04) for (int i = 0; i < 2; i++) {
    float y0 = i == 0 ? .9 : 1.24;
    float w = sdArch(vec2(tf.x + .02, tf.y), .032, y0, y0 - .18);
    c += mix(vec3(.08, .5, .44), vec3(.4, .2, .7), float(i)) * (smoothstep(.006, -.012, w) * .9 + smoothstep(.06, -.01, w) * .18);
  }
  return c;
}

void main() {
  vec2 frag = gl_FragCoord.xy + jitter;
  vec2 uv = (frag - resolution * .5) / resolution.y;
  vec3 rd = normalize(camFwd + (uv.x * camRight + uv.y * camUp) * camScale);
  vec3 ro = camPos;
  float t = 0.; vec2 h = vec2(1e3, 0.); bool hit = false;
  for (int i = 0; i < 240; i++) {
    h = scene(ro + rd * t);
    if (h.x < .0005) { hit = true; break; }
    t += h.x * .85;
    if (t > 24.) break;
  }
  if (!hit) { gl_FragColor = vec4(0.); return; }
  vec3 P = ro + rd * t, N = normalAt(P), V = -rd;
  float ndv = clamp(dot(N, V), 0., 1.), edge = 1. - ndv;
  float fresnel = .04 + .96 * pow(edge, 5.);
  vec3 color;
  if (h.y > 1.5) {
    color = display(roomThrough(P));
  } else {
    vec3 rd2 = refract(rd, N, .76);
    if (dot(rd2, rd2) < .01) rd2 = rd;
    float T;
    vec3 inner = inside(P, rd2, T);
    // The skin, as the orb's.
    vec3 diffuse = vec3(0.), specular = vec3(0.), wrap = vec3(0.);
    for (int i = 0; i < 5; i++) {
      vec3 L = lightDir(i), C = lightCol(i);
      float wr = max(0., (dot(N, L) + .4) / 1.4);
      diffuse += C * wr * wr;
      float nh = max(dot(N, normalize(L + V)), 0.);
      float crisp = i == 0 || i == 3 ? 1. : 0.;
      specular += mix(C, vec3(dot(C, vec3(.333))), .55) * (crisp * (pow(nh, 420.) * 1.2 + pow(nh, 80.) * .12) + pow(nh, 30.) * .012 * (1. - crisp));
      wrap += C * pow(edge, 4.5) * smoothstep(-.1, .6, dot(N, L)) * max(0., .5 - .5 * dot(L, V));
    }
    vec3 skin = specular + voidLight(reflect(-V, N)) * fresnel * .8 + wrap * .5;
    skin += mix(vec3(.006, .05, .042), vec3(.035, .016, .075), smoothstep(-.6, .6, N.x)) * pow(edge, 4.);
    // A thin film on the glass: violet, green and aqua where it turns away.
    vec3 film = .5 + .5 * cos(6.2832 * (edge * 1.5 + vec3(0., .33, .67)) + 1.2);
    skin += film * vec3(.14, .13, .2) * pow(edge, 2.6) * .38;
    if (subject < .5) {
      // The room's warm light spills out of the entrance onto the glass round it.
      vec3 toL = vec3(DOOR_X, -.22, 1.18) - P;
      float dist = length(toL);
      skin += vec3(.9, .5, .22) * max(0., dot(N, toL / dist)) * exp(-dist * dist * 4.5) * .55 * (1. - step(.5, h.y));
      skin += windowLight(P);
      // The entrance's walls: darker glass, warm near the back.
      if (h.y > .5) {
        float back = smoothstep(.95, .45, P.z);
        skin = skin * .4 + roomThrough(vec3(P.x * .7, P.y, P.z)) * .17 * back;
        inner *= .22;
      }
    }
    vec3 body = vec3(.002, .007, .008) * (.6 + .4 * ndv);
    // Where the glass is thin (drips, the neck, the spire) the light behind it
    // comes through: teal low, violet high, as the orb's edges.
    vec3 through = mix(vec3(.03, .12, .11), vec3(.08, .045, .13), smoothstep(-1.4, 2.4, P.y)) * T * T;
    color = display(inner * (1. - fresnel) + skin + body + through);
  }
  gl_FragColor = vec4(color, 1.);
}`;

const vertex = 'attribute vec2 position; void main(){gl_Position=vec4(position,0.,1.);}';
function compile(type, source) {
  const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const u = name => gl.getUniformLocation(program, name);

const sub = (a, b) => a.map((v, i) => v - b[i]);
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
function camera(setup = CAMERA) {
  const {target, distance, yaw, pitch} = setup;
  const pos = [target[0] + distance * Math.sin(yaw) * Math.cos(pitch), target[1] + distance * Math.sin(pitch), target[2] + distance * Math.cos(yaw) * Math.cos(pitch)];
  const fwd = norm(sub(target, pos)), right = norm(cross(fwd, [0, 1, 0])), up = cross(right, fwd);
  return {pos, fwd, right, up, scale: Math.tan(setup.fov / 2) * 2};
}
// Where a point lands in the image, as fractions from the top left.
function project(p) {
  const c = camera(), d = sub(p, c.pos), z = dot(d, c.fwd);
  return [.5 + dot(d, c.right) / z / c.scale, .5 - dot(d, c.up) / z / c.scale];
}

// Renders in tiles (each a short draw, well within the GPU's watchdog) and
// several jittered passes averaged, for clean edges; then a soft bloom from
// the brightest light (the entrance, the windows, the highlights), and a
// faint dither so the dark gradients do not band.
async function render({size = 1400, time = 0, subject = 'building', samples = 4, background = null, bloom = true} = {}) {
  canvas.width = canvas.height = size;
  const c = camera(subject === 'drop' ? DROP_CAMERA : CAMERA);
  gl.viewport(0, 0, size, size);
  gl.uniform2f(u('resolution'), size, size);
  gl.uniform1f(u('time'), time);
  gl.uniform1f(u('subject'), subject === 'drop' ? 1 : 0);
  gl.uniform3fv(u('camPos'), c.pos); gl.uniform3fv(u('camFwd'), c.fwd);
  gl.uniform3fv(u('camRight'), c.right); gl.uniform3fv(u('camUp'), c.up);
  gl.uniform1f(u('camScale'), c.scale);
  const acc = document.createElement('canvas'); acc.width = acc.height = size;
  const ctx = acc.getContext('2d', {willReadFrequently: true});
  const sum = new Float32Array(size * size * 4);
  const offsets = [[.25, .25], [.75, .75], [.75, .25], [.25, .75], [.5, .5], [.1, .6], [.6, .1], [.9, .9], [.4, .9], [.9, .4], [.1, .1], [.6, .6]].slice(0, samples);
  const tile = 160;
  gl.enable(gl.SCISSOR_TEST);
  for (const [jx, jy] of offsets) {
    gl.uniform2f(u('jitter'), jx - .5, jy - .5);
    for (let y = 0; y < size; y += tile) for (let x = 0; x < size; x += tile) {
      gl.scissor(x, y, tile, tile); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.finish(); await new Promise(r => setTimeout(r));
    }
    ctx.clearRect(0, 0, size, size); ctx.drawImage(canvas, 0, 0);
    const data = ctx.getImageData(0, 0, size, size).data;
    // Premultiplied sums.
    for (let i = 0; i < data.length; i += 4) {
      const a = data[i + 3] / 255;
      sum[i] += data[i] * a; sum[i + 1] += data[i + 1] * a; sum[i + 2] += data[i + 2] * a; sum[i + 3] += a;
    }
  }
  gl.disable(gl.SCISSOR_TEST);
  const n = offsets.length;
  for (let i = 0; i < sum.length; i++) sum[i] /= n;   // premultiplied rgb (0..255), alpha 0..1
  if (bloom) {
    // The bright pass, blurred twice and added back (premultiplied).
    const bright = ctx.createImageData(size, size);
    for (let i = 0; i < sum.length; i += 4) {
      const lum = (.2126 * sum[i] + .7152 * sum[i + 1] + .0722 * sum[i + 2]) / 255;
      const k = Math.max(0, lum - .42) / .58;
      bright.data[i] = sum[i] * k; bright.data[i + 1] = sum[i + 1] * k; bright.data[i + 2] = sum[i + 2] * k; bright.data[i + 3] = 255;
    }
    const src = document.createElement('canvas'); src.width = src.height = size;
    src.getContext('2d').putImageData(bright, 0, 0);
    const blurred = radius => {
      const b = document.createElement('canvas'); b.width = b.height = size;
      const bx = b.getContext('2d', {willReadFrequently: true});
      bx.fillStyle = '#000'; bx.fillRect(0, 0, size, size);
      bx.filter = `blur(${radius}px)`; bx.drawImage(src, 0, 0);
      return bx.getImageData(0, 0, size, size).data;
    };
    const near = blurred(size / 160), far = blurred(size / 48);
    for (let i = 0; i < sum.length; i += 4) {
      const g = [near[i] * .55 + far[i] * .4, near[i + 1] * .55 + far[i + 1] * .4, near[i + 2] * .55 + far[i + 2] * .4];
      sum[i] += g[0]; sum[i + 1] += g[1]; sum[i + 2] += g[2];
      // The glow beyond the glass carries its own (additive) coverage.
      sum[i + 3] = Math.min(1, Math.max(sum[i + 3], Math.max(g[0], g[1], g[2]) / 255));
    }
  }
  const out = ctx.createImageData(size, size);
  for (let i = 0; i < sum.length; i += 4) {
    const a = sum[i + 3], dither = Math.random() - .5;
    if (a > 0) for (let k = 0; k < 3; k++) out.data[i + k] = Math.min(255, Math.max(0, sum[i + k] / a + dither));
    out.data[i + 3] = Math.round(a * 255);
  }
  ctx.putImageData(out, 0, 0);
  if (background) { const b = document.createElement('canvas'); b.width = b.height = size; const bx = b.getContext('2d'); bx.fillStyle = background; bx.fillRect(0, 0, size, size); bx.drawImage(acc, 0, 0); window.lastRender = b; return b; }

}
async function encode(acc, type = 'image/webp', quality = .9) { return acc.toDataURL(type, quality).split(',')[1]; }

// The entrance, the neck's tip and the spire's tip on the image.
const doorZ = Math.sqrt(.95 * .95 - DOOR.x * DOOR.x);
const apex = DOOR.spring + DOOR.a * Math.sqrt(3);
const [cx, cy] = project([DOOR.x, (DOOR.sill + apex) / 2, doorZ]);
const [lx] = project([DOOR.x - DOOR.a, (DOOR.sill + apex) / 2, doorZ]), [rx] = project([DOOR.x + DOOR.a, (DOOR.sill + apex) / 2, doorZ]);
const [, ty] = project([DOOR.x, apex, doorZ]), [, by] = project([DOOR.x, DOOR.sill, doorZ]);
const [nx, ny] = project(NECK_TIP), [sx, sy] = project([TOWER[0], 1.42 + 1.28, TOWER[2]]);
// The falling drop's image, as a fraction of the building's: the same lens,
// so its frame is to the building's as the two distances.
window.exteriorArt = {render, encode, camera: CAMERA,
  points: {door: {x: cx, y: cy, width: rx - lx, height: by - ty}, neck: {x: nx, y: ny}, spire: {x: sx, y: sy},
    dropSize: DROP_CAMERA.distance / CAMERA.distance}};
window.exteriorArt.door = window.exteriorArt.points.door;
document.body.dataset.ready = 'yes';
</script>
